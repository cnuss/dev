name: Build and Push Docker Image

on:
  push:
    branches:
      - latest
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build-amd:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: ${{ github.ref == 'refs/heads/latest' }}
          tags: ghcr.io/${{ github.repository }}:amd-sha-${{ github.sha }}
          cache-from: type=gha,scope=amd
          cache-to: type=gha,mode=max,scope=amd

  build-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: ${{ github.ref == 'refs/heads/latest' }}
          tags: ghcr.io/${{ github.repository }}:arm-sha-${{ github.sha }}
          cache-from: type=gha,scope=arm
          cache-to: type=gha,mode=max,scope=arm

  smoke-amd:
    needs: build-amd
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}:amd-sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Homebrew smoke test
        run: .homebrew/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh

  smoke-arm:
    needs: build-arm
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/${{ github.repository }}:arm-sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Homebrew smoke test
        run: .homebrew/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh

  push:
    needs: [smoke-amd, smoke-arm]
    if: github.ref == 'refs/heads/latest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            index.docker.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Resolve image names
        id: images
        run: echo "list=$(echo '${{ steps.meta.outputs.json }}' | jq -c '[.tags[] | split(":")[0]] | unique')" >> $GITHUB_OUTPUT

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            $(echo '${{ steps.meta.outputs.json }}' | jq -cr '.tags | map("--tag " + .) | join(" ")') \
            ghcr.io/${{ github.repository }}:amd-sha-${{ github.sha }} \
            ghcr.io/${{ github.repository }}:arm-sha-${{ github.sha }}

      - name: Get manifest digest
        id: digest
        run: echo "digest=$(docker buildx imagetools inspect --raw ghcr.io/${{ github.repository }}:latest | sha256sum | awk '{print "sha256:" $1}')" >> $GITHUB_OUTPUT

      - name: Extract SBOMs from image
        id: sbom
        run: |
          docker pull ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          CID=$(docker create ghcr.io/${{ github.repository }}:sha-${{ github.sha }})
          docker cp $CID:/usr/local/share/sbom /home/runner/sbom
          docker rm $CID
          echo "files=$(ls /home/runner/sbom/*.spdx.json | xargs -n1 basename | jq -Rnc '[inputs]')" >> $GITHUB_OUTPUT

      - name: Upload attestation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: /home/runner/sbom/

      - name: Submit SBOMs to dependency graph
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: /home/runner/sbom/

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (DockerHub)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM (GHCR)
        uses: actions/attest@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: /home/runner/sbom/sbom.spdx.json
          push-to-registry: true

      - name: Attest SBOM (DockerHub)
        uses: actions/attest@v2
        with:
          subject-name: index.docker.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: /home/runner/sbom/sbom.spdx.json
          push-to-registry: true

  verify:
    needs: push
    runs-on: ubuntu-latest
    container:
      image: ${{ github.repository }}:latest
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Homebrew smoke test
        run: .homebrew/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh
