name: Build and Push Docker Image

on:
  push:
    branches:
      - latest
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.ref == 'refs/heads/latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    needs: build-and-push
    if: github.ref == 'refs/heads/latest'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Ubuntu smoke test
        run: .ubuntu/smoke.sh

      - name: ASDF smoke test
        run: .asdf/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh

  publish-feature:
    needs: smoke-test
    if: github.ref == 'refs/heads/latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to DockerHub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | oras login registry-1.docker.io -u ${{ github.repository_owner }} --password-stdin

      - name: Package Feature tarball
        run: tar czf devcontainer-feature-dev.tgz devcontainer-feature.json install.sh .ubuntu/ .asdf/ .claude/

      - name: Create OCI config
        run: echo '{}' > config.json

      - name: Publish Feature to GHCR
        run: >-
          oras push ghcr.io/${{ github.repository }}:1
          --config config.json:application/vnd.devcontainers
          devcontainer-feature-dev.tgz:application/vnd.devcontainers.layer.v1+tar

      - name: Publish Feature to DockerHub
        run: >-
          oras push registry-1.docker.io/${{ github.repository }}:1
          --config config.json:application/vnd.devcontainers
          devcontainer-feature-dev.tgz:application/vnd.devcontainers.layer.v1+tar
