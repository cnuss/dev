name: Build and Push Docker Image

on:
  push:
    branches:
      - latest
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      images: ${{ steps.images.outputs.list }}
      sbom-files: ${{ steps.sbom.outputs.files }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            index.docker.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Resolve image names
        id: images
        run: echo "list=$(echo '${{ steps.meta.outputs.json }}' | jq -c '[.tags[] | split(":")[0]] | unique')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.ref == 'refs/heads/latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract SBOMs from image
        id: sbom
        if: github.ref == 'refs/heads/latest'
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:latest
          CID=$(docker create $IMAGE)
          docker cp $CID:/usr/local/share/sbom /home/runner/sbom
          docker rm $CID
          echo "files=$(ls /home/runner/sbom/*.spdx.json | xargs -n1 basename | jq -Rnc '[inputs]')" >> $GITHUB_OUTPUT

      - name: Upload attestation artifacts
        if: github.ref == 'refs/heads/latest'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: /home/runner/sbom/

      - name: Submit SBOMs to dependency graph
        if: github.ref == 'refs/heads/latest'
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: /home/runner/sbom/

  attest:
    needs: build-and-push
    if: github.ref == 'refs/heads/latest'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        registry: ${{ fromJSON(needs.build-and-push.outputs.images) }}
        sbom: ${{ fromJSON(needs.build-and-push.outputs.sbom-files) }}
    permissions:
      attestations: write
      id-token: write
      packages: write
    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Login to DockerHub
        if: contains(matrix.registry, 'docker.io')
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: contains(matrix.registry, 'ghcr.io')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        if: matrix.sbom == fromJSON(needs.build-and-push.outputs.sbom-files)[0]
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ matrix.registry }}
          subject-digest: ${{ needs.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@v2
        with:
          subject-name: ${{ matrix.registry }}
          subject-digest: ${{ needs.build-and-push.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: ${{ matrix.sbom }}
          push-to-registry: true

  smoke-test:
    needs: build-and-push
    if: github.ref == 'refs/heads/latest'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Homebrew smoke test
        run: .homebrew/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh
