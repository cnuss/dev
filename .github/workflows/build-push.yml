name: Build and Push Docker Image

on:
  push:
    branches:
      - latest
  pull_request:
  schedule:
    # Weekly rebuild (Mondays 06:00 UTC) to pick up base image and package
    # updates. Runs on the default branch, so it publishes like a push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  # Scheduled runs share github.ref with pushes to latest, so keep them in
  # separate groups — otherwise a cron firing mid-merge cancels the merge build.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  build-amd:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final
          platforms: linux/amd64
          pull: true
          # PRs push their per-commit tags too, so the smoke jobs below have an
          # image to pull. Fork PRs can't write packages, so they only build.
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          # A cached scheduled run would reinstall the exact same packages and
          # defeat the point of rebuilding, so bypass the cache on cron.
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/${{ github.repository }}:amd-sha-${{ github.sha }}
          cache-from: type=gha,scope=amd
          cache-to: type=gha,mode=max,scope=amd
          build-args: |
            SBOM_NAME=${{ github.repository }}
            SBOM_AUTHOR=${{ github.actor }}
            SBOM_EMAIL=${{ github.actor }}@users.noreply.github.com
            SBOM_NAMESPACE=https://github.com/${{ github.repository }}

      # Same build graph plus every on-demand tool preinstalled (see
      # .ondemand/). Shares the stages above, so it's mostly cache hits.
      - name: Build full image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          platforms: linux/amd64
          # PRs push their per-commit tags too, so the smoke jobs below have an
          # image to pull. Fork PRs can't write packages, so they only build.
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/${{ github.repository }}:amd-full-sha-${{ github.sha }}
          cache-from: |
            type=gha,scope=amd
            type=gha,scope=amd-full
          cache-to: type=gha,mode=max,scope=amd-full
          build-args: |
            SBOM_NAME=${{ github.repository }}
            SBOM_AUTHOR=${{ github.actor }}
            SBOM_EMAIL=${{ github.actor }}@users.noreply.github.com
            SBOM_NAMESPACE=https://github.com/${{ github.repository }}

  build-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final
          platforms: linux/arm64
          pull: true
          # PRs push their per-commit tags too, so the smoke jobs below have an
          # image to pull. Fork PRs can't write packages, so they only build.
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          # A cached scheduled run would reinstall the exact same packages and
          # defeat the point of rebuilding, so bypass the cache on cron.
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/${{ github.repository }}:arm-sha-${{ github.sha }}
          cache-from: type=gha,scope=arm
          cache-to: type=gha,mode=max,scope=arm
          build-args: |
            SBOM_NAME=${{ github.repository }}
            SBOM_AUTHOR=${{ github.actor }}
            SBOM_EMAIL=${{ github.actor }}@users.noreply.github.com
            SBOM_NAMESPACE=https://github.com/${{ github.repository }}

      # Same build graph plus every on-demand tool preinstalled (see
      # .ondemand/). Shares the stages above, so it's mostly cache hits.
      - name: Build full image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          platforms: linux/arm64
          # PRs push their per-commit tags too, so the smoke jobs below have an
          # image to pull. Fork PRs can't write packages, so they only build.
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ghcr.io/${{ github.repository }}:arm-full-sha-${{ github.sha }}
          cache-from: |
            type=gha,scope=arm
            type=gha,scope=arm-full
          cache-to: type=gha,mode=max,scope=arm-full
          build-args: |
            SBOM_NAME=${{ github.repository }}
            SBOM_AUTHOR=${{ github.actor }}
            SBOM_EMAIL=${{ github.actor }}@users.noreply.github.com
            SBOM_NAMESPACE=https://github.com/${{ github.repository }}

  smoke-amd:
    needs: build-amd
    runs-on: ubuntu-24.04
    # A hung smoke (e.g. a helper that idles instead of exiting) must fail fast,
    # not sit for the 6h default and block the run.
    timeout-minutes: 10
    container:
      image: ghcr.io/${{ github.repository }}:amd-sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh

      - name: On-demand smoke test
        run: .ondemand/smoke.sh

      - name: Image helper smoke test
        run: .bin/smoke.sh

  smoke-arm:
    needs: build-arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    container:
      image: ghcr.io/${{ github.repository }}:arm-sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh

      - name: On-demand smoke test
        run: .ondemand/smoke.sh

      - name: Image helper smoke test
        run: .bin/smoke.sh

  smoke-full-amd:
    needs: build-amd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/${{ github.repository }}:amd-full-sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh

      - name: On-demand smoke test
        run: .ondemand/smoke.sh

      # Preinstalled in :full, so this must pass without any download.
      - name: On-demand tools smoke test
        run: .ondemand/smoke-tools.sh

      - name: Image helper smoke test
        run: .bin/smoke.sh

  smoke-full-arm:
    needs: build-arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    container:
      image: ghcr.io/${{ github.repository }}:arm-full-sha-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh

      - name: On-demand smoke test
        run: .ondemand/smoke.sh

      # Preinstalled in :full, so this must pass without any download.
      - name: On-demand tools smoke test
        run: .ondemand/smoke-tools.sh

      - name: Image helper smoke test
        run: .bin/smoke.sh

  push:
    needs: [smoke-amd, smoke-arm, smoke-full-amd, smoke-full-arm]
    if: github.ref == 'refs/heads/latest'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            index.docker.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long

      - name: Resolve image names
        id: images
        run: echo "list=$(echo '${{ steps.meta.outputs.json }}' | jq -c '[.tags[] | split(":")[0]] | unique')" >> $GITHUB_OUTPUT

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            $(echo '${{ steps.meta.outputs.json }}' | jq -cr '.tags | map("--tag " + .) | join(" ")') \
            ghcr.io/${{ github.repository }}:amd-sha-${{ github.sha }} \
            ghcr.io/${{ github.repository }}:arm-sha-${{ github.sha }}

      - name: Get manifest digest
        id: digest
        run: echo "digest=$(docker buildx imagetools inspect --raw ghcr.io/${{ github.repository }}:latest | sha256sum | awk '{print "sha256:" $1}')" >> $GITHUB_OUTPUT

      - name: Extract SBOMs from image
        id: sbom
        run: |
          docker pull ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          CID=$(docker create ghcr.io/${{ github.repository }}:sha-${{ github.sha }})
          docker cp $CID:/usr/local/share/sbom /home/runner/sbom
          docker rm $CID
          echo "files=$(ls /home/runner/sbom/*.spdx.json | xargs -n1 basename | jq -Rnc '[inputs]')" >> $GITHUB_OUTPUT

      - name: Strip Debian epochs for dependency graph
        run: |
          mkdir -p /home/runner/depgraph
          # The submission action parses the purl in externalRefs, not versionInfo,
          # so stripping versionInfo alone left "pkg:deb/ubuntu/bsdutils@1%3A2.41.3"
          # intact. Those packages were rejected and silently dropped from the
          # snapshot while the job still went green. Strip both.
          jq '.packages[].externalRefs[]? |= (
                if .referenceType == "purl"
                then .referenceLocator |= sub("@[0-9]+%3A"; "@")
                else . end
              )
              | .packages[].versionInfo |= sub("^[0-9]+:"; "")' \
            /home/runner/sbom/sbom.spdx.json > /home/runner/depgraph/depgraph.spdx.json

          # Fail loudly if any epoch survives in a purl version position; a
          # silent drop is worse than a red build here.
          remaining=$(jq '[.packages[]
            | (.externalRefs[]? | select(.referenceType == "purl") | .referenceLocator)
            | select(test("@[0-9]+%3A"))] | length' /home/runner/depgraph/depgraph.spdx.json)
          if [ "$remaining" != "0" ]; then
            echo "::error::$remaining purl(s) still carry a Debian epoch; they would be dropped from the dependency graph"
            exit 1
          fi

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: /home/runner/sbom/

      - name: Submit SBOMs to dependency graph
        uses: advanced-security/spdx-dependency-submission-action@v0.2.0
        with:
          filePath: /home/runner/depgraph/

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (DockerHub)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM (GHCR)
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: /home/runner/sbom/sbom.spdx.json
          push-to-registry: true

      - name: Attest SBOM (DockerHub)
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ github.repository }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: /home/runner/sbom/sbom.spdx.json
          push-to-registry: true

      - name: Create and push full multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:full \
            --tag ghcr.io/${{ github.repository }}:full-sha-${{ github.sha }} \
            --tag index.docker.io/${{ github.repository }}:full \
            --tag index.docker.io/${{ github.repository }}:full-sha-${{ github.sha }} \
            ghcr.io/${{ github.repository }}:amd-full-sha-${{ github.sha }} \
            ghcr.io/${{ github.repository }}:arm-full-sha-${{ github.sha }}

      - name: Get full manifest digest
        id: digest-full
        run: echo "digest=$(docker buildx imagetools inspect --raw ghcr.io/${{ github.repository }}:full | sha256sum | awk '{print "sha256:" $1}')" >> $GITHUB_OUTPUT

      - name: Attest full build provenance (GHCR)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest-full.outputs.digest }}
          push-to-registry: true

      - name: Attest full build provenance (DockerHub)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ github.repository }}
          subject-digest: ${{ steps.digest-full.outputs.digest }}
          push-to-registry: true

      # :full ships the same SBOM file as :latest — the on-demand packages are
      # already listed there — so attest that one.
      - name: Attest full SBOM (GHCR)
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digest-full.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: /home/runner/sbom/sbom.spdx.json
          push-to-registry: true

      - name: Attest full SBOM (DockerHub)
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ github.repository }}
          subject-digest: ${{ steps.digest-full.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: /home/runner/sbom/sbom.spdx.json
          push-to-registry: true

  verify:
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ github.repository }}:latest
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh

      - name: On-demand smoke test
        run: .ondemand/smoke.sh

      - name: Image helper smoke test
        run: .bin/smoke.sh

  verify-full:
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ github.repository }}:full
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: On-demand smoke test
        run: .ondemand/smoke.sh

      - name: On-demand tools smoke test
        run: .ondemand/smoke-tools.sh
