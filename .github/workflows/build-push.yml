name: Build and Push Docker Image

on:
  push:
    branches:
      - latest
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.ref == 'refs/heads/latest' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest GHCR image
        if: github.ref == 'refs/heads/latest'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest Docker Hub image
        if: github.ref == 'refs/heads/latest'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sbom:
    needs: build-and-push
    if: github.ref == 'refs/heads/latest'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}:latest
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          dependency-snapshot: false

      - name: Extract brew manifest from image
        run: docker run --rm --entrypoint cat ghcr.io/${{ github.repository }}:latest /usr/local/share/sbom/brew.json > brew.json

      - name: Enrich SBOM with Homebrew packages
        run: python3 .sbom/enrich.py sbom.spdx.json brew.json sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom.spdx.json
          path: sbom.spdx.json

      - name: Attest SBOM to GHCR image
        uses: actions/attest-sbom@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ needs.build-and-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest SBOM to Docker Hub image
        uses: actions/attest-sbom@v4
        with:
          subject-name: index.docker.io/${{ github.repository }}
          subject-digest: ${{ needs.build-and-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Submit SBOM to dependency graph
        uses: anchore/sbom-action/publish-sbom@v0
        continue-on-error: false
        with:
          sbom-artifact-match: sbom.spdx.json

  smoke-test:
    needs: build-and-push
    if: github.ref == 'refs/heads/latest'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Apt smoke test
        run: .apt/smoke.sh

      - name: Homebrew smoke test
        run: .homebrew/smoke.sh

      - name: Claude smoke test
        run: .claude/smoke.sh
